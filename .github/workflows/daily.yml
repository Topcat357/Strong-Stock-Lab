name: Daily after close

# 4:30 pm New York time on weekdays (both summer and winter UTC hours).
# The job catches up any sessions it missed and skips ones already done,
# so a late or doubled run is harmless.
on:
  schedule:
    - cron: "30 20,21 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional: process just this session (YYYY-MM-DD)"
        default: ""

permissions:
  contents: write

concurrency:
  group: lab
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run daily job
        env:
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          ONE_DATE: ${{ github.event.inputs.date }}
        run: |
          set -o pipefail
          if [ -n "$ONE_DATE" ]; then args=(--date "$ONE_DATE"); else args=(); fi
          python run_daily.py "${args[@]}" 2>&1 | tee data/last_daily.log
      - name: Save to the repo (also when a step failed, so the log is kept)
        if: always()
        run: |
          git config user.name "strong-stock-lab-bot"
          git config user.email "strong-stock-lab-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Daily $(TZ=America/New_York date '+%Y-%m-%d')"
          git pull --rebase
          git push
