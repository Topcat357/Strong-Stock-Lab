name: Weekly screen

# Sunday evening: report on last week, then freeze this week's cohort.
# Runs at both 22:00 and 23:00 UTC so it lands at 6 pm New York time in summer and winter;
# the second run sees the cohort file already exists and does nothing.
on:
  schedule:
    - cron: "0 22,23 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild today's cohort even if it exists (yes/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: lab
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Weekly report
        run: python report.py
      - name: Build cohort
        env:
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "yes" ]; then python run_weekly.py --force; else python run_weekly.py; fi
      - name: Save to the repo
        run: |
          git config user.name "strong-stock-lab-bot"
          git config user.email "strong-stock-lab-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "Nothing new" && exit 0
          git commit -m "Weekly screen $(TZ=America/New_York date '+%Y-%m-%d')"
          git pull --rebase
          git push
